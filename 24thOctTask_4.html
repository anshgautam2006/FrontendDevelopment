<html lang="en">
<head>

    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            border: solid;
            padding: 5px;
        }
        
        .box{
            border: solid;

        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="box">Box 1</div>
        <div class="box">Box 1</div>
        <div class="box">Box 1</div>
        <div class="box">Box 1</div>
        <div class="box">Box 1</div>
        <div class="box">Box 1</div>
    </div>
    <hr>
    
</body>
</html>
