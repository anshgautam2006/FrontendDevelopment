<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: 2fr 1fr;
            width: 600px;
            gap: 10px;
            padding: 5px;
            border: solid;
        }
        .columns{
            border: solid;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="columns">column 1</div>
        <div class="columns">column 1</div>
        <div class="columns">column 1</div>
        <div class="columns">column 1</div>
    </div>
</body>
</html>
